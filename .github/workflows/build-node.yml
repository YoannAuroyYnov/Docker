name: Build node image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: schoolspace-node:${{ github.sha }}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" ./node

      - name: Log result
        run: |
          echo "Image : $IMAGE"
          docker image inspect "$IMAGE" --format 'ID     : {{.Id}}
          Created: {{.Created}}
          Size   : {{.Size}} bytes
          OS/Arch: {{.Os}}/{{.Architecture}}'
          echo "Node   : $(docker run --rm "$IMAGE" node --version)"
          echo "npm    : $(docker run --rm "$IMAGE" npm --version)"

      - name: Job summary
        run: |
          {
            echo "### Build node image ✅"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Size | $(docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}') |"
            echo "| Node | $(docker run --rm "$IMAGE" node --version) |"
            echo "| npm | $(docker run --rm "$IMAGE" npm --version) |"
          } >> "$GITHUB_STEP_SUMMARY"
